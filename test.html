<!DOCTYPE html>
<html>
<head>
    <title>NodeX Location Viewer</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        body{
            font-family:Arial;
            margin:20px;
        }

        #map{
            height:500px;
            margin-top:20px;
        }

        select{
            padding:10px;
            font-size:16px;
        }
    </style>
</head>
<body>

<h2>NodeX Location History</h2>

<select id="locationList"></select>

<div id="map"></div>

<script>

const map = L.map('map').setView([9.9787,76.3062],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap contributors'
}).addTo(map);

let marker = null;
const locations = [];

fetch("locations.txt")
.then(res => res.text())
.then(text => {

    const lines = text.trim().split("\n");
    const select = document.getElementById("locationList");

    lines.forEach((line,index)=>{

        const p = line.split("|");

        locations.push({
            name:p[0],
            lat:Number(p[1]),
            lon:Number(p[2])
        });

        let option = document.createElement("option");
        option.value=index;
        option.textContent=p[0];

        select.appendChild(option);

    });

    showLocation(0);

});

function showLocation(index){

    const loc = locations[index];

    if(marker){
        map.removeLayer(marker);
    }

    marker = L.marker([loc.lat,loc.lon]).addTo(map);

    marker.bindPopup(loc.name).openPopup();

    map.setView([loc.lat,loc.lon],17);

}

document.getElementById("locationList").addEventListener("change",function(){

    showLocation(parseInt(this.value));

});

</script>

</body>
</html>
